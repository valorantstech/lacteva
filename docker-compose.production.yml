# Lacteva — production stack (DEP-001).
#
#   cp .env.production.example .env.production   # then fill it in
#   docker compose -f docker-compose.production.yml --env-file .env.production up -d
#
# Read DEPLOYMENT.md before running this the first time. The short version:
#
#   * Nothing here mounts source. The API runs the image that was built and
#     tagged, and `LACTEVA_IMAGE_TAG` is the only thing that decides which one
#     — which is also what makes rollback a one-variable change.
#   * Ordering is by HEALTH CHECK, never by sleep. A sleep is a guess that is
#     either too short (and fails under load) or too long (and taxes every
#     deploy forever).
#   * Migrations are a separate one-shot service that must EXIT ZERO before
#     the API is allowed to start. A failed migration aborts the deployment
#     instead of leaving an API running against a schema that is not there.
#   * No database port is published. The only thing reachable from outside
#     this network is nginx.

name: lacteva-production

# Every service logs the same way, so a log driver is configured once.
#
# DEMO-010 lowered the ceiling. 50m × 5 files across thirteen services is a
# 3.25GB entitlement on a 38GB disk that twice reached 100% — a quiet, standing
# claim on a third of the headroom. 20m × 3 is 780MB across the whole stack,
# and loses nothing that matters: promtail ships every line to Loki as it is
# written, so these files are a short local buffer, not the log archive.
x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

# The API and the migration job are the same image with the same configuration
# — they differ only in what they run. Anchoring it means they cannot drift,
# which matters because a migration run against different settings than the
# API is a very confusing failure.
x-api-base: &api-base
  image: ${LACTEVA_IMAGE:-lacteva/platform-core}:${LACTEVA_IMAGE_TAG:?set LACTEVA_IMAGE_TAG — deploys are pinned, never :latest}
  # AWS-001: an ABSOLUTE path, and overridable.
  #
  # `--env-file` (what deploy.sh passes) supplies variables for INTERPOLATING
  # this file. `env_file:` is a different mechanism: it injects variables into
  # the container, and it resolves relative to the compose file. deploy.sh and
  # INFRASTRUCTURE.md both keep the environment at /etc/lacteva/.env.production
  # (root, 0600) while this line looked for it next to the compose file inside
  # the release directory, so the documented deployment failed at the first
  # `compose` call with "env file /opt/lacteva/current/.env.production not
  # found". Naming the real location makes the two agree, and keeps the secret
  # out of the release tree.
  env_file: ["${LACTEVA_ENV_FILE:-/etc/lacteva/.env.production}"]
  volumes:
    # AWS-001: the API had NO /backup mount, and it is the process that writes
    # backups — `platform_core.core.backup.cli backup /backup/logical/...` is
    # what DEPLOYMENT.md documents, what the nightly timer runs, and what
    # deploy.sh takes before every upgrade. Without this the first real backup
    # failed outright, and a pre-deployment backup would have been silently
    # written into a container layer that the next deploy destroys.
    - backups:/backup
  environment:
    LACTEVA_ENV: prod
    # VER-001: the APPLICATION role, which is deliberately not the owner and
    # emphatically not a superuser — a superuser IGNORES every row-level
    # security policy, so connecting as ${POSTGRES_USER} silently disabled
    # tenant isolation at the database. The `migrate` service below overrides
    # this back to the owner, because DDL needs it.
    LACTEVA_DATABASE_URL: postgresql+asyncpg://${LACTEVA_APP_USER:?set LACTEVA_APP_USER — the API must not connect as the superuser}:${LACTEVA_APP_PASSWORD:?set LACTEVA_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}
    LACTEVA_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    # DEPLOY-001: the stack had NO event transport and no way to configure one,
    # while `prod` refuses `event_bus=memory` because it accepts every publish
    # and delivers nothing. Deploying exactly as documented therefore produced
    # an API that refused to start — found by resolving this file rather than
    # reading it. The guard was right; the stack simply could not satisfy it.
    LACTEVA_EVENT_BUS: rabbitmq
    LACTEVA_RABBITMQ_URL: amqp://${RABBITMQ_USER:?set RABBITMQ_USER}:${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}@rabbitmq:5672/
  logging: *logging
  restart: unless-stopped

services:
  # --- data ---------------------------------------------------------------
  # WAL-001: give the archive volume to the postgres user BEFORE postgres
  # starts.
  #
  # Docker creates a named volume's mount point ROOT-OWNED when the path does
  # not exist in the image, and `/wal-archive` does not exist in postgres:16.
  # The server runs as uid 999, so `archive_command` failed with "Permission
  # denied" on every segment: `pg_stat_archiver` read archived_count=0,
  # failed_count=114 on the first real deployment. PostgreSQL treats that as a
  # WARNING and keeps serving, so the container stayed HEALTHY and nothing
  # alerted — while point-in-time recovery, the entire point of PITR-001, did
  # not exist. The same defect as the API's /backup mount (AWS-001), in the
  # service where it costs the most.
  #
  # A one-shot rather than a custom image: it is three lines, it is idempotent,
  # and it keeps the stock postgres image.
  wal-archive-init:
    image: postgres:${POSTGRES_VERSION:-16}
    user: root
    volumes:
      - wal_archive:/wal-archive
    command: ["sh", "-c", "chown 999:999 /wal-archive && chmod 700 /wal-archive"]
    restart: "no"
    logging: *logging

  postgres:
    image: postgres:${POSTGRES_VERSION:-16}
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Consumed by the init script below, which creates the unprivileged
      # role the API connects as.
      LACTEVA_APP_USER: ${LACTEVA_APP_USER:?set LACTEVA_APP_USER}
      LACTEVA_APP_PASSWORD: ${LACTEVA_APP_PASSWORD:?set LACTEVA_APP_PASSWORD}
      # Data lives on the volume; initdb only runs on an empty one.
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - pgdata:/var/lib/postgresql/data
      # The WAL archive. On a SEPARATE volume from pgdata on purpose: an
      # archive that dies with the data directory recovers nothing, which is
      # the failure mode PITR exists to survive. Mount this on different
      # storage, and replicate it off-host.
      - wal_archive:/wal-archive
      # DEMO-011: physical backups are PostgreSQL's own job, and postgres is
      # the only container with `pg_basebackup`, `pg_verifybackup` and
      # `pg_archivecleanup`, network reach to itself, and the WAL archive.
      # The database port is deliberately not published, so a base backup
      # taken from the host cannot connect at all — which is why the weekly
      # physical backup had never run.
      - backups:/backup
      - ./infra/backup:/opt/backup:ro
      # VER-001. Runs ONCE, on an empty data directory — an existing database
      # needs the same statements applied by hand (DEPLOYMENT.md §Database
      # roles). The API refuses to start if it is skipped.
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    depends_on:
      wal-archive-init:
        condition: service_completed_successfully
    # Deliberately NOT published. Reaching the database means being on this
    # network or opening an SSH tunnel, which is a decision someone makes
    # rather than a port someone forgets.
    expose: ["5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    command:
      # Modest, defensible defaults. ABR-002 §9 has the full tuning table;
      # these are the settings whose absence causes incidents rather than
      # slowness. Anything beyond this belongs in a managed parameter group.
      - postgres
      - -c
      - max_connections=${POSTGRES_MAX_CONNECTIONS:-200}
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-512MB}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-16MB}
      - -c
      - maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-1GB}
      - -c
      - wal_level=replica
      - -c
      # PITR-001. `wal_level=replica` alone was here, and it is necessary and
      # NOT sufficient: without archiving, no WAL ever leaves this container
      # and point-in-time recovery is impossible. The documented 5-minute RPO
      # was therefore fiction — the real RPO was the age of the last logical
      # backup. Proven end to end by `./infra/ci/pitr-proof.sh`.
      - archive_mode=on
      - -c
      # DEMO-011 replaced `test ! -f /wal-archive/%f && cp %p /wal-archive/%f`
      # — PostgreSQL's own documented example, and the thing that broke.
      #
      # `cp` is not atomic. An interrupted copy leaves a PARTIAL file at the
      # destination; `test ! -f` then sees a file and returns non-zero, and
      # the same segment is retried forever. Archiving stopped on
      # 2026-08-12T17:41Z with one 3.3MB fragment of a 16MB segment, 58
      # segments queued in pg_wal, 945MB of them, and no alert — PostgreSQL
      # logs a warning and keeps serving.
      #
      # The script writes to a temporary file and renames (atomic within a
      # filesystem), treats a byte-identical file as success so a post-crash
      # re-archive cannot wedge it, and REFUSES a same-name-different-content
      # collision rather than destroying a recovery point. The refusal to
      # overwrite that the old comment was reaching for is kept — it is now
      # a comparison rather than an existence check.
      - archive_command=/opt/backup/archive-wal.sh %p %f
      - -c
      # A segment is archived when it FILLS, not when it is written. On a
      # quiet night the last transactions would otherwise sit unarchived for
      # hours — this is what actually bounds the RPO.
      - archive_timeout=${POSTGRES_ARCHIVE_TIMEOUT:-60}
      - -c
      - max_wal_size=4GB
      - -c
      - checkpoint_completion_target=0.9
      - -c
      # An unbounded query holds its snapshot and blocks vacuum across the
      # whole database (ABR-002 F-10). The application sets its own, tighter
      # value; this is the backstop for anything that connects by hand.
      - statement_timeout=${POSTGRES_STATEMENT_TIMEOUT:-120000}
      - -c
      - shared_preload_libraries=pg_stat_statements
    logging: *logging
    restart: unless-stopped
    stop_grace_period: 60s

  redis:
    image: redis:7-alpine
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-512mb}
      # Rate-limit counters are the load-bearing use. Evicting the oldest key
      # under pressure is correct: the limiter fails open by design (SEC-001),
      # so a lost counter costs a little accuracy, never a request.
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redisdata:/data
    expose: ["6379"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    logging: *logging
    restart: unless-stopped

  # The durable transport the Relay dispatches through. Internal only: nothing
  # outside this network has any business reaching the broker, and the
  # management plugin is deliberately NOT enabled — it is another listener and
  # another credential for a UI nobody operates day to day.
  rabbitmq:
    image: rabbitmq:${RABBITMQ_VERSION:-3.13-alpine}
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?set RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD}
      # A broker that fills its disk stops accepting publishes, which stops
      # milk collection. Leave headroom rather than discover the limit.
      RABBITMQ_DISK_FREE_LIMIT: ${RABBITMQ_DISK_FREE_LIMIT:-2GB}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    expose: ["5672"]
    healthcheck:
      # `check_running` alone reports a broker that is up but not yet accepting
      # connections; `check_port_connectivity` is what the API actually needs.
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_port_connectivity"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    logging: *logging
    restart: unless-stopped

  # --- schema -------------------------------------------------------------
  migrate:
    <<: *api-base
    environment:
      LACTEVA_ENV: prod
      # The OWNER, not the application role. Alembic issues DDL, and the
      # application role deliberately cannot — that separation is what stops
      # a compromised request from dropping a policy.
      LACTEVA_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      LACTEVA_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    # A one-shot job, not a service. `restart: no` is the important line: a
    # migration that fails must ABORT the deployment, and a restart policy
    # would turn a clear failure into a crash loop that looks like a slow
    # start. The API's `service_completed_successfully` then never fires, so
    # nothing serves traffic against a schema that did not apply.
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  # --- application --------------------------------------------------------
  api:
    <<: *api-base
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    expose: ["8000"]
    command:
      - uvicorn
      - platform_core.main:app
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --workers
      - ${API_WORKERS:-4}
      # Uvicorn drains in-flight requests for this long before the lifespan
      # shutdown runs. The workers then get LACTEVA_SHUTDOWN_GRACE_SECONDS to
      # finish the unit of work they are in, and `stop_grace_period` below
      # must exceed the sum of both or the container is killed mid-drain.
      - --timeout-graceful-shutdown
      - ${API_GRACEFUL_TIMEOUT:-30}
      - --proxy-headers
      - --forwarded-allow-ips
      - "*"
    stop_grace_period: 90s
    healthcheck:
      # Readiness, not liveness: the container is "healthy" only when it is
      # fit to receive traffic, which is what nginx's upstream depends on.
      test: ["CMD-SHELL", "python -c \"import urllib.request as u,sys; sys.exit(0 if u.urlopen('http://127.0.0.1:8000/health/ready', timeout=4).status==200 else 1)\""]
      interval: 15s
      timeout: 6s
      retries: 4
      start_period: 45s
    deploy:
      resources:
        limits:
          memory: ${API_MEMORY_LIMIT:-1g}

  # --- admin portal -------------------------------------------------------
  # PORTAL-001 / F-03. The portal had no service here at all: it built, and
  # there was no way to ship it. It is internal-only — nginx is still the sole
  # port publisher — and it is the ONLY thing that talks to the API on the
  # browser's behalf, which is what keeps the session token out of the browser
  # (F-11) and the platform's address off the public internet.
  portal:
    image: ${PORTAL_IMAGE:-lacteva/admin-portal}:${LACTEVA_IMAGE_TAG:?set LACTEVA_IMAGE_TAG — deploys are pinned, never :latest}
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      # Server-side only, resolved at request time. Never a NEXT_PUBLIC_*
      # variable: those are inlined into the browser bundle at build time, so
      # one image could only ever reach one backend and an unset value shipped
      # `localhost:8000` to production browsers.
      LACTEVA_API_URL: http://api:8000
    expose: ["3000"]
    healthcheck:
      # The portal's own liveness. Deliberately not the API's readiness — a
      # database maintenance window must not restart a healthy frontend.
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s
    logging: *logging
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: ${PORTAL_MEMORY_LIMIT:-512m}

  # --- edge ---------------------------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      api:
        condition: service_healthy
      portal:
        condition: service_healthy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - ${TLS_CERT_DIR:-./infra/nginx/certs}:/etc/nginx/certs:ro
      - nginx-cache:/var/cache/nginx
      # TLS-001: the ACME webroot. `lacteva.conf` has always served
      # `/.well-known/acme-challenge/` from /var/www/certbot, and nothing
      # mounted anything there — so the documented certbot step could not
      # have worked. Shared with the certbot one-shot below.
      - certbot_webroot:/var/www/certbot
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health || exit 1"]
      interval: 15s
      timeout: 4s
      retries: 4
      start_period: 10s
    logging: *logging
    restart: unless-stopped

  # --- observability ------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./infra/observability/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
      - --web.enable-lifecycle
    expose: ["9090"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 4
      start_period: 20s
    logging: *logging
    restart: unless-stopped

  loki:
    image: grafana/loki:3.2.1
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./infra/observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    expose: ["3100"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3100/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 6
      start_period: 30s
    logging: *logging
    restart: unless-stopped

  # A read-only, single-purpose view of the Docker API.
  #
  # Promtail needs container metadata to label logs by service. Mounting
  # /var/run/docker.sock to get it would hand a LOG SHIPPER the ability to
  # start privileged containers — the Docker API is root on the host, and
  # `:ro` on a unix socket restricts nothing about the calls made through it.
  # This proxy exposes exactly one endpoint family and refuses the rest, so
  # the blast radius of a compromised promtail is "can list containers".
  dockerproxy:
    image: tecnativa/docker-socket-proxy:0.2.0
    environment:
      CONTAINERS: "1"   # the only thing promtail needs
      POST: "0"         # no mutations of any kind
      EXEC: "0"
      IMAGES: "0"
      NETWORKS: "0"
      VOLUMES: "0"
      INFO: "0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    expose: ["2375"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:2375/containers/json?limit=1 >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 4
      start_period: 10s
    logging: *logging
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.2.1
    command: ["-config.file=/etc/promtail/promtail.yml"]
    volumes:
      - ./infra/observability/loki/promtail.yml:/etc/promtail/promtail.yml:ro
      # The log files themselves, read-only. No Docker socket here — see
      # `dockerproxy` above.
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      loki:
        condition: service_healthy
      dockerproxy:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9080/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 4
      start_period: 15s
    logging: *logging
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.1
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3001}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./infra/observability/grafana:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    expose: ["3000"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 4
      start_period: 20s
    logging: *logging
    restart: unless-stopped

volumes:
  # AWS-001: where the platform's own logical backups land. See x-api-base.
  #
  # DEMO-011: a BIND onto the dedicated data volume, not a Docker named
  # volume. Named volumes live under /var/lib/docker on the ROOT disk — the
  # same block device as `pgdata` — so the only copy of every backup sat on
  # the one device whose loss is the reason backups exist. `/var/lib/lacteva`
  # is a separate 49GB EBS volume that was provisioned for exactly this and
  # was empty: the provisioning ran `mkdir /var/lib/lacteva/{postgres,...}`
  # under a shell without brace expansion, so it created one directory with
  # that literal name and everything silently went to the default location.
  #
  # This is still one machine. Losing the instance loses both. Off-host
  # replication is `backup.cli replicate`; see DEMO-011-DR-RUNBOOK.md.
  backups:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${LACTEVA_BACKUP_DIR:-/var/lib/lacteva/backup}
  # TLS-001: shared between nginx (serves the challenge) and certbot (writes
  # it). A named volume rather than a bind, so nothing depends on the release
  # directory still existing at renewal time.
  certbot_webroot:
  pgdata:
  # PITR-001. Keep this on different storage from `pgdata` — an archive that
  # fails with the data directory is not a recovery path. Size it for the
  # retention window: WAL volume x the days between base backups.
  #
  # DEMO-011 made that true rather than aspirational: as a named volume it was
  # on the same device as `pgdata`, which is precisely what this comment says
  # not to do. It is now a bind onto the dedicated data volume.
  wal_archive:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${LACTEVA_WAL_DIR:-/var/lib/lacteva/wal-archive}
  rabbitmq-data:
  redisdata:
  prometheus-data:
  loki-data:
  grafana-data:
  nginx-cache:

networks:
  default:
    name: lacteva-production
