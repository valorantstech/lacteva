# Alembic configuration for platform-core.
# The database URL is taken from LACTEVA_DATABASE_URL at runtime (migrations/env.py);
# the value below is a dev fallback only.
[alembic]
script_location = migrations
sqlalchemy.url = postgresql+asyncpg://lacteva:lacteva@localhost:5432/lacteva

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
