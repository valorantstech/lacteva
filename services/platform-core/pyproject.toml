[project]
name = "platform-core"
version = "0.1.0"
description = "Lacteva Platform Foundation: identity, organizations, authn/authz, configuration, audit, and platform infrastructure (events, notifications, storage, search)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.32",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "pyjwt[crypto]>=2.9",
    "argon2-cffi>=23.1",
    "structlog>=24.4",
    "aio-pika>=9.4",
    "redis>=5.0",
    "minio>=7.2",
    "opensearch-py>=2.6",
    "prometheus-client>=0.20",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "ruff>=0.6",
    "pre-commit>=3.8",
    # Real PostgreSQL binaries in a wheel — server AND client. This is what
    # lets `infra/ci/verify-postgres.sh` and `infra/ci/dr-proof.sh` execute
    # against a genuine engine with no Docker, no daemon and no root. Before
    # VER-001 the PostgreSQL pipeline had never actually run, and five defects
    # lived through six work orders because of it.
    "pgserver>=0.1",
    # PITR-001: the production-readiness tests parse
    # docker-compose.production.yml to assert WAL archiving is configured.
    # It was already present transitively; declared here because a test that
    # depends on somebody else's dependency breaks for reasons nobody can see.
    "pyyaml>=6.0",
    # WO-62: the frozen-date proof. Shifting the platform's own `utcnow()`
    # does not move PyJWT, which validates `exp`/`iat` against the real system
    # clock — so WO-58's attempt 401'd every token it minted. `time-machine`
    # patches the clock at the INTERPRETER level (CPython's `datetime` and
    # `time` C hooks), so the platform and every library it uses read the same
    # frozen day and agree about it.
    "time-machine>=2.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_core"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "B",         # bugbear
    "UP",        # pyupgrade
    "S",         # bandit (security)
    "ASYNC",     # async pitfalls
    "T20",       # no stray prints
    "RUF",
]
ignore = ["S101"]  # assert is fine in tests; S101 scoped below

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "T20"]
# S105/S106 false-positives: `token_type` is an OAuth2 discriminator, not a secret.
"src/platform_core/core/security.py" = ["S105"]
"src/platform_core/modules/auth/service.py" = ["S106"]
# The operator CLI prints its results; that is its entire purpose.
"src/platform_core/core/backup/cli.py" = ["T20"]
# DEMO-025: the notification catalog is deliberately multilingual — Hindi,
# Arabic and Swahili message bodies. RUF001 flags Arabic letters as "ambiguous"
# with Latin ones, which is true of the alphabet and irrelevant to a template
# a farmer reads. Confined to this one file so the check keeps working
# everywhere it is meaningful.
"src/platform_core/modules/notification/templates.py" = ["RUF001"]
# Alembic-autogenerated files keep their generated shape.
"migrations/versions/*" = ["E501"]
# The verification tooling is a set of CLIs: printing is their output, and the
# temporary directory holds a throwaway database cluster on purpose.
"../../infra/ci/*.py" = ["T20", "S108"]
# The load harness is a reporting CLI too: a latency table nobody can read is
# not a measurement. Its fixture read happens once, before any concurrency.
"../../infra/perf/*.py" = ["T20", "ASYNC240"]
# The model registry keeps one deliberately "unused" import block (CI-001);
# removing it would make a backup silently capture one table.
"src/platform_core/core/model_registry.py" = ["F401"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:platform_core.*"]

[tool.uv]
# uv is the canonical package manager for this service (uv sync / uv run).
