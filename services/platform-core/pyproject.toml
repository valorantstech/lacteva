[project]
name = "platform-core"
version = "0.1.0"
description = "Lacteva Platform Foundation: identity, organizations, authn/authz, configuration, audit, and platform infrastructure (events, notifications, storage, search)."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic[email]>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.32",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "pyjwt[crypto]>=2.9",
    "argon2-cffi>=23.1",
    "structlog>=24.4",
    "aio-pika>=9.4",
    "redis>=5.0",
    "minio>=7.2",
    "opensearch-py>=2.6",
    "prometheus-client>=0.20",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "ruff>=0.6",
    "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platform_core"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "B",         # bugbear
    "UP",        # pyupgrade
    "S",         # bandit (security)
    "ASYNC",     # async pitfalls
    "T20",       # no stray prints
    "RUF",
]
ignore = ["S101"]  # assert is fine in tests; S101 scoped below

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "T20"]
# S105/S106 false-positives: `token_type` is an OAuth2 discriminator, not a secret.
"src/platform_core/core/security.py" = ["S105"]
"src/platform_core/modules/auth/service.py" = ["S106"]
# The operator CLI prints its results; that is its entire purpose.
"src/platform_core/core/backup/cli.py" = ["T20"]
# Alembic-autogenerated files keep their generated shape.
"migrations/versions/*" = ["E501"]
# env.py imports every model module purely for the side effect of registering
# tables in Base.metadata. They look unused to the linter, and removing them
# makes `alembic revision --autogenerate` emit a migration that DROPS EVERY
# TABLE — which happened once (OFF-001, caught and restored in BAK-001).
# Guarded by tests/test_migrations.py.
"migrations/env.py" = ["F401", "RUF100"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:platform_core.*"]

[tool.uv]
# uv is the canonical package manager for this service (uv sync / uv run).
