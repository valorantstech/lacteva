# Prometheus scrape configuration for Lacteva platform-core (OBS-001).
#
# The platform exposes /metrics unauthenticated on the service port — it
# carries no tenant data and no identities by construction (see the
# cardinality rule in core/metrics.py), so scraping needs no credential.
# Restrict reachability at the network layer, not with a shared secret.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: platform-core
    metrics_path: /metrics
    static_configs:
      - targets: ["platform-core:8000"]
        labels:
          service: platform-core
