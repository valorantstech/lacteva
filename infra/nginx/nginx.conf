# Lacteva production reverse proxy (DEP-001).
#
# nginx is the only thing on this stack with a published port. Everything it
# fronts — the API, Grafana, Prometheus — is reachable only on the compose
# network, so this file is the platform's entire external attack surface.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # The request id is generated here when the client did not supply one, and
    # handed to the API as X-Request-ID — which is the same header
    # `RequestContextMiddleware` binds into every log line and persists onto
    # every outbox event (BR-0024). One id therefore spans nginx, the API, and
    # every consumer that later handles the event.
    map $http_x_request_id $request_id_final {
        default   $http_x_request_id;
        ""        $request_id;
    }

    log_format json escape=json '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"duration_ms":$request_time,'
        '"upstream_ms":"$upstream_response_time",'
        '"request_id":"$request_id_final",'
        '"user_agent":"$http_user_agent"'
    '}';
    access_log /var/log/nginx/access.log json;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    server_tokens off;              # do not advertise the version
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Bulk supplier import and document upload are the large ones. Set here so
    # every server block inherits it; a 413 from nginx is invisible to the
    # application and confusing to diagnose.
    client_max_body_size 25m;
    client_body_timeout 60s;
    client_header_timeout 20s;

    # Compression. `gzip_proxied any` matters because everything here arrives
    # through a proxy; without it responses to proxied requests stay
    # uncompressed, which is most of them.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types application/json application/javascript application/xml
               text/css text/plain text/xml image/svg+xml;

    # Abuse control at the edge, in front of the application's own limiter.
    # These are deliberately generous: the API's limiter is the precise one
    # (per identifier, per route), and this exists only to stop a flood from
    # reaching Python at all.
    limit_req_zone $binary_remote_addr zone=api:16m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=conn:16m;

    proxy_cache_path /var/cache/nginx/static levels=1:2 keys_zone=static:32m
                     max_size=1g inactive=24h use_temp_path=off;

    include /etc/nginx/conf.d/*.conf;
}
