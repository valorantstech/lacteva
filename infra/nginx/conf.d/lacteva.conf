# Lacteva — the public vhosts (DEP-001, PORTAL-001, WO-63).
#
# One TLS boundary, three upstreams, four names (WO-63 / D-20):
#
#   lacteva.com, www.lacteva.com  the marketing site
#   app.lacteva.com               the admin portal (which proxies the API itself)
#   api.lacteva.com               the platform API — what the mobile app calls
#   dev.phoenixsoft.in            unchanged: portal AND API, because installed
#                                 handsets carry it as a build-time constant
#
# Anything else reaching this address is REFUSED by the default server below
# rather than being handed whichever site loaded first. Every upstream is an
# internal-only container; nginx is the sole port publisher.
#
# HTTPS-ready rather than HTTPS-only: the TLS server block is live, and the
# plain-HTTP block redirects to it, but a deployment terminating TLS at a load
# balancer in front of this can keep using port 80 by setting
# `TLS_ENABLED=false` and dropping the redirect. Both are documented in
# DEPLOYMENT.md; neither is a code change.

upstream lacteva_portal {
    # PORTAL-001 / F-03. The Next.js server: it holds the session cookie and
    # proxies to the API on the browser's behalf, so it is the only client of
    # `lacteva_api` that a browser ever causes.
    server portal:3000 max_fails=3 fail_timeout=15s;
    keepalive 32;
    keepalive_timeout 60s;
}

upstream lacteva_marketing {
    # WO-63 / MARKETING-001. The public website, at last deployed: it has been
    # built and tested since the first audit and had nowhere to be served
    # from, because the platform had no domain of its own. A SEPARATE upstream
    # from the portal on purpose — the site holds no session and talks to no
    # API, so nothing it does can reach a dairy's data, and deploying one does
    # not restart the other.
    server marketing:3100 max_fails=3 fail_timeout=15s;
    keepalive 16;
    keepalive_timeout 60s;
}

upstream lacteva_api {
    # `api` resolves to every replica of the API service on the compose
    # network. keepalive matters here: without it nginx opens a new connection
    # per request and the API spends its time in TCP setup under load.
    server api:8000 max_fails=3 fail_timeout=15s;
    keepalive 64;
    keepalive_timeout 60s;
}

# Shared proxy settings. Repeating these per location is how one of them
# quietly ends up different from the others.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # The container health check hits this, so it must answer before and
    # during a redirect-everything-to-HTTPS configuration.
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        include /etc/nginx/conf.d/security-headers.inc;
        return 200 "ok\n";
    }

    # ACME http-01 challenges must stay on port 80 or renewal fails.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- an unrecognised name gets a straight answer, not somebody else's site ---
#
# THE DEFAULT SERVER IS A REFUSAL, and it is declared first so that it cannot
# be decided by load order. Without this block the first `server` in the file
# would silently become the default, and every name that happens to point at
# this address — a stale record, a typo, a scan of the IP — would be served
# the marketing site as though we had meant it to be.
#
# 421 Misdirected Request is exactly what happened: this server is not able to
# produce a response for the authority in the request. It is diagnosable by a
# person (unlike 444, which closes the connection and reads as a network
# fault) and it is honest to a machine. A client only reaches it after a TLS
# handshake that presented a certificate for names it did not ask for, so the
# usual visitor here is a scanner or a misconfigured record — and either way
# the answer names the four hostnames this platform does serve.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;
    server_name _;

    include /etc/nginx/conf.d/tls.inc;

    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        include /etc/nginx/conf.d/security-headers.inc;
        return 200 "ok\n";
    }

    location / {
        include /etc/nginx/conf.d/security-headers.inc;
        add_header Content-Type text/plain always;
        return 421 "This host is not served here. Try lacteva.com, app.lacteva.com or api.lacteva.com.\n";
    }
}

# --- lacteva.com, www.lacteva.com — the marketing site ----------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name lacteva.com www.lacteva.com;

    include /etc/nginx/conf.d/tls.inc;

    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        include /etc/nginx/conf.d/security-headers.inc;
        return 200 "ok\n";
    }

    include /etc/nginx/conf.d/locations-marketing.inc;
}

# --- app.lacteva.com, dev.phoenixsoft.in — the admin portal ------------------
#
# `dev.phoenixsoft.in` is here rather than retired: every demo handset in the
# field carries it as a BUILD-TIME constant (`main.dart`), so the name has to
# go on answering exactly what it answered yesterday — the portal at `/` and
# the API under `/v1/` — until those installs are replaced. Keeping it is one
# line; breaking it is a store release.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.lacteva.com dev.phoenixsoft.in;

    include /etc/nginx/conf.d/tls.inc;

    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        include /etc/nginx/conf.d/security-headers.inc;
        return 200 "ok\n";
    }

    include /etc/nginx/conf.d/locations-portal.inc;
    include /etc/nginx/conf.d/locations-api.inc;
}

# --- api.lacteva.com — the API, and nothing else ----------------------------
#
# The name the mobile app is built against from now on. It serves the API and
# does NOT serve the portal: `/` here reaches the platform, which answers an
# unknown path with problem+json, because a machine asking this host for a
# page has made a mistake and should be told so in the format it parses.
#
# Its own name exists so the address the app cannot cheaply change can be
# repointed at other infrastructure with one DNS record, and so browser
# traffic and machine traffic can be given different edge policy later
# without either one having to be untangled from the other first.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.lacteva.com;

    include /etc/nginx/conf.d/tls.inc;

    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        include /etc/nginx/conf.d/security-headers.inc;
        return 200 "ok\n";
    }

    include /etc/nginx/conf.d/locations-api.inc;

    # Everything else on this host is the API's to answer. A machine asking
    # the API host for a page gets the platform's own problem+json 404, in
    # the format it already parses, rather than nginx's HTML error page or —
    # worse — a portal it did not ask for.
    location / {
        include /etc/nginx/conf.d/security-headers-api.inc;
        limit_req zone=api burst=60 nodelay;
        limit_conn conn 50;
        proxy_pass http://lacteva_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id_final;
        proxy_read_timeout 75s;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }
}
