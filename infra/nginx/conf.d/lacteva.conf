# Lacteva — the public vhost (DEP-001, extended by PORTAL-001).
#
# One TLS boundary, two upstreams: the admin portal owns `/`, the platform API
# owns `/v1/`, `/docs`, `/openapi.json`, `/health/` and `/metrics`. Browsers
# reach the portal; the mobile client and any integration reach the API. Both
# are internal-only containers — nginx is the sole port publisher.
#
# HTTPS-ready rather than HTTPS-only: the TLS server block is live, and the
# plain-HTTP block redirects to it, but a deployment terminating TLS at a load
# balancer in front of this can keep using port 80 by setting
# `TLS_ENABLED=false` and dropping the redirect. Both are documented in
# DEPLOYMENT.md; neither is a code change.

upstream lacteva_portal {
    # PORTAL-001 / F-03. The Next.js server: it holds the session cookie and
    # proxies to the API on the browser's behalf, so it is the only client of
    # `lacteva_api` that a browser ever causes.
    server portal:3000 max_fails=3 fail_timeout=15s;
    keepalive 32;
    keepalive_timeout 60s;
}

upstream lacteva_api {
    # `api` resolves to every replica of the API service on the compose
    # network. keepalive matters here: without it nginx opens a new connection
    # per request and the API spends its time in TCP setup under load.
    server api:8000 max_fails=3 fail_timeout=15s;
    keepalive 64;
    keepalive_timeout 60s;
}

# Shared proxy settings. Repeating these per location is how one of them
# quietly ends up different from the others.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    # The container health check hits this, so it must answer before and
    # during a redirect-everything-to-HTTPS configuration.
    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        include /etc/nginx/conf.d/security-headers.inc;
        return 200 "ok\n";
    }

    # ACME http-01 challenges must stay on port 80 or renewal fails.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;   # TLS 1.3 chooses better than we do
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # --- security headers -------------------------------------------------
    # The API sets its own (SEC-001, `core/http_security.py`); these cover the
    # responses nginx produces itself — redirects, 413s, 502s — which never
    # reach the application middleware. `always` is required or they are
    # omitted from exactly those error responses.
    #
    # HSTS is the one to be careful with: it is close to irreversible for the
    # max-age you choose, so it is off until TLS is genuinely permanent.
    include /etc/nginx/conf.d/security-headers.inc;

    location = /nginx-health {
        access_log off;
        add_header Content-Type text/plain;
        include /etc/nginx/conf.d/security-headers.inc;
        return 200 "ok\n";
    }

    # --- the admin portal -------------------------------------------------
    # `/` is the product a person opens. Every API path below is matched by a
    # more specific location, so this never swallows one.
    location / {
        limit_req zone=api burst=60 nodelay;
        limit_conn conn 50;

        proxy_pass http://lacteva_portal;
        proxy_http_version 1.1;

        # WebSocket upgrade. No endpoint uses it today; the platform's roadmap
        # has live collection monitoring, and discovering this is missing
        # during that work order is more expensive than four lines now.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Correlation id in, so the API binds the same one nginx logged.
        proxy_set_header X-Request-ID      $request_id_final;

        proxy_connect_timeout 5s;
        proxy_send_timeout    60s;
        # Longer than the API's own 30s statement timeout, so a slow request
        # is ended by the application (which logs why) rather than by nginx
        # (which only knows that it waited).
        proxy_read_timeout    75s;

        proxy_buffering on;
        proxy_buffers 16 16k;
        proxy_busy_buffers_size 32k;
        # Bulk import posts a whole file; buffering the request body to disk
        # first means a slow client cannot hold a Python worker open.
        proxy_request_buffering on;

        # A DEPLOY MUST REACH AN OPEN BROWSER (DEMO-010).
        #
        # Next sends `Cache-Control: s-maxage=31536000` for prerendered pages
        # and nothing a browser is required to honour — no `max-age`, no
        # `no-cache`. A browser is then free to apply heuristic freshness and
        # keep serving the PREVIOUS release's shell, which references the
        # previous release's chunks, for as long as it likes. That is how a
        # fix that is demonstrably live on the server is still not what the
        # person in front of it sees, and it makes every future portal fix
        # arrive at a time nobody can predict.
        #
        # `no-cache` does not mean "do not store": it means "store it, but
        # revalidate before reusing it". The ETag makes that a 304 in the
        # common case, so the cost is one conditional request per navigation
        # and the guarantee is that the shell is never older than the server.
        #
        # `/_next/static/` is a MORE SPECIFIC location and is unaffected —
        # those filenames are content-hashed, so they stay immutable for a
        # year. Only the document that names them is revalidated.
        #
        # `proxy_hide_header` first, because `add_header` APPENDS: without it
        # the response carries two Cache-Control values and the browser is
        # entitled to believe either.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache" always;
        # Re-stated: this location's own add_header would otherwise drop
        # every inherited security header. See security-headers.inc.
        include /etc/nginx/conf.d/security-headers.inc;
    }

    # --- health and metrics ----------------------------------------------
    # Liveness and readiness are polled constantly. Excluding them from the
    # access log keeps the log about traffic rather than about polling.
    location ~ ^/health/(live|ready)$ {
        access_log off;
        proxy_pass http://lacteva_api;
        proxy_set_header Host $host;
    }

    # Prometheus scrapes over the internal network. Exposing it publicly would
    # publish tenant counts, queue depths and error rates to anyone.
    location = /metrics {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://lacteva_api;
        proxy_set_header Host $host;
    }

    # --- static assets ----------------------------------------------------
    # The API's own static files (not the portal's — those are under
    # /_next/static/ above).
    location /static/ {
        proxy_pass http://lacteva_api;
        proxy_cache static;
        proxy_cache_valid 200 301 302 24h;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # Next.js build output is content-hashed, so it is immutable and can be
    # cached hard. Served from the portal, not the API.
    location /_next/static/ {
        proxy_pass http://lacteva_portal;
        proxy_cache static;
        proxy_cache_valid 200 24h;
        proxy_cache_lock on;
        # Hide first: `add_header` appends, so without this the response
        # carries the upstream's Cache-Control as well as ours.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/conf.d/security-headers.inc;
        add_header X-Cache-Status $upstream_cache_status;
    }

    # The API's own documentation surface stays on the API even though the
    # portal owns `/`. Exact matches, so `/docs` cannot shadow a portal route.
    location = /docs {
        proxy_pass http://lacteva_api;
        proxy_set_header Host $host;
    }
    location = /redoc {
        proxy_pass http://lacteva_api;
        proxy_set_header Host $host;
    }
    location = /openapi.json {
        proxy_pass http://lacteva_api;
        proxy_set_header Host $host;
    }

    # Never cache an API response: they are tenant-scoped, and a cache that
    # does not know that is a cross-tenant leak with extra steps.
    # Sign-in, refresh, password reset: the same proxying as /v1/, on the
    # tighter budget. A whole collection centre shares one address, so the
    # burst is sized for a shift starting at once, not for one handset.
    location /v1/auth/ {
        limit_req zone=auth burst=20 nodelay;
        limit_conn conn 50;
        proxy_pass http://lacteva_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id_final;
        proxy_read_timeout 75s;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    location /v1/ {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://lacteva_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID      $request_id_final;
        proxy_read_timeout 75s;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }
}
