# Local PostgreSQL proof (CI-001; version matrix and teardown, OPS-001).
#
#   docker compose -f docker-compose.proof.yml run --rm proof
#
# Match a specific matrix leg from .github/workflows/postgres.yml:
#
#   POSTGRES_VERSION=17 docker compose -f docker-compose.proof.yml run --rm proof
#
# Keep the databases standing after a failure, to look at them:
#
#   KEEP_DATABASES=1 docker compose -f docker-compose.proof.yml run --rm proof
#
# Runs EXACTLY the script CI runs (infra/ci/postgres-proof.sh) against a
# throwaway PostgreSQL. One code path means a green CI and a green laptop
# mean the same thing — the alternative is two pipelines that agree until the
# day they matter.
#
# The database is intentionally ephemeral (no volume): every run starts from
# an empty database, because "migrations apply from empty" is one of the
# things being proven.
services:
  postgres:
    # Same versions the workflow's matrix runs; default is the production
    # baseline documented in DBD-0001.
    image: postgres:${POSTGRES_VERSION:-16}
    environment:
      # The schema OWNER — a superuser, as the official image makes it. The
      # proof creates an unprivileged `lacteva_app` role and runs the
      # isolation tests as that, because a superuser ignores row-level
      # security entirely and would make step 3 pass vacuously (VER-001).
      POSTGRES_USER: lacteva
      POSTGRES_PASSWORD: lacteva
      POSTGRES_DB: postgres
    # No ports published and no volume: throwaway by design.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lacteva"]
      interval: 3s
      timeout: 3s
      retries: 20

  proof:
    image: python:3.13-slim
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: lacteva
      PGPASSWORD: lacteva
      # uv installs into the container; the repo is mounted read-write so the
      # virtualenv it creates does not fight the host's.
      UV_PROJECT_ENVIRONMENT: /tmp/proof-venv
      # Passed through so a local run can keep the databases for inspection,
      # exactly as the workflow_dispatch input does in CI.
      KEEP_DATABASES: ${KEEP_DATABASES:-0}
    working_dir: /repo
    volumes:
      - .:/repo
    entrypoint: ["/bin/bash", "-lc"]
    command: >-
      "apt-get update -qq
       && apt-get install -y -qq --no-install-recommends postgresql-client curl ca-certificates
       && curl -LsSf https://astral.sh/uv/install.sh | sh
       && export PATH=/root/.local/bin:$$PATH
       && cd /repo/services/platform-core && uv sync --quiet
       && cd /repo && ./infra/ci/postgres-proof.sh"
