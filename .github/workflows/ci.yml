name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docs:
    name: Documentation standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate documentation
        run: python3 tools/validate/validate_docs.py
      - name: Check XREF freshness
        run: python3 tools/xref/generate_xref.py --check

  platform-core:
    name: platform-core (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/platform-core
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: services/platform-core/pyproject.toml
      - name: Install dependencies
        run: uv sync
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Tests
        run: uv run pytest
      - name: Migrations apply cleanly
        run: LACTEVA_DATABASE_URL=sqlite+aiosqlite:///./ci-migrate.db uv run alembic upgrade head
      # WO-62: the date guarantee, executed rather than argued for. The
      # date-sensitive suites are run again on five awkward days — month
      # start, month end, both sides of New Year, a leap day — with the
      # interpreter's own clock moved, so PyJWT and the platform agree about
      # what day it is. WO-58's tail is why this is a gate and not a comment:
      # three further date defects surfaced inside a single batch, each
      # visible only in a particular hour or month.
      - name: Date proof (the suite on five awkward days)
        run: PYTHON="uv run python" ../../infra/ci/date-proof.sh

  # PostgreSQL verification lives in its own workflow (OPS-001):
  # .github/workflows/postgres.yml — a version matrix, a service container,
  # the nine-step proof, and a hard failure on any skipped PostgreSQL test.
  # It is NOT duplicated here. This workflow is the fast, hermetic half
  # (SQLite, ~790 tests, no services); that one is the slow, real half.

  admin-portal:
    name: admin-portal (build + lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin-portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/admin-portal/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Lint
        run: npx eslint src --max-warnings 0
      # PORTAL-001 / F-09. Wired into CI from the start: an unwired suite is
      # how a portal ends up with zero tests again.
      - name: Test
        run: npm test

  marketing-site:
    name: marketing-site (build + lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/marketing-site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/marketing-site/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Lint
        run: npx eslint src --max-warnings 0
      # Wired into CI from the start, same reason as the portal's suite —
      # and claims.test.ts makes marketing copy discipline executable.
      - name: Test
        run: npm test

  mobile:
    name: mobile (analyze + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Analyze
        run: flutter analyze
      - name: Tests
        run: flutter test

  # WO-67. The release build path — R8 shrinking, resource shrinking, the
  # signing guard — was covered by tests that read build.gradle.kts and by
  # nothing that RAN it. The first release build this project ever attempted
  # failed at `:app:minifyReleaseWithR8`, on a rule that had been missing
  # since PORTAL-001 and that no test could see. So every push now builds a
  # release APK. It is signed with a keystore GENERATED ON THIS RUNNER and
  # thrown away: no secret is needed, which is what lets it run on pull
  # requests, and the result is deliberately NOT uploaded — an APK with a
  # one-day throwaway certificate must never be mistaken for a release. The
  # distributable one comes from release-apk.yml and the owner's key.
  mobile-release-build:
    name: mobile (release build compiles, throwaway key)
    runs-on: ubuntu-latest
    needs: mobile
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Throwaway keystore
        # The passwords are literal and worthless: the key exists for the
        # length of this job and signs nothing that leaves the runner. The
        # DN says so, and infra/ci/verify-release-apk.sh refuses it.
        run: |
          keytool -genkeypair -keystore android/ci-throwaway.jks \
            -storepass ci-throwaway -keypass ci-throwaway -alias throwaway \
            -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=CI throwaway, O=NOT FOR DISTRIBUTION"
          cat > android/key.properties <<'EOF'
          storeFile=../ci-throwaway.jks
          storePassword=ci-throwaway
          keyAlias=throwaway
          keyPassword=ci-throwaway
          EOF
      - name: Release build (the address a distributed build carries)
        run: flutter build apk --release --dart-define=LACTEVA_API_URL=https://api.lacteva.com
      - name: It is signed, and not with the debug key
        # The verifier's job is to reject this APK — it is a throwaway
        # signature — so the assertion here is the inverse: a throwaway
        # signature is what came out, not the debug key and not nothing.
        run: |
          apksigner="$(ls -1 "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)"
          certs="$("$apksigner" verify --print-certs build/app/outputs/flutter-apk/app-release.apk)"
          echo "$certs"
          echo "$certs" | grep -q 'CN=CI throwaway' || { echo "APK is not signed with the key this job made"; exit 1; }
          if ../../infra/ci/verify-release-apk.sh build/app/outputs/flutter-apk/app-release.apk; then
            echo "the verifier ACCEPTED a throwaway-signed APK — it must refuse anything but the release key"; exit 1
          fi
      - name: Remove the keystore
        if: always()
        run: rm -f android/key.properties android/ci-throwaway.jks

  platform-core-image:
    name: platform-core (docker build)
    runs-on: ubuntu-latest
    needs: platform-core
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t lacteva/platform-core:${{ github.sha }} services/platform-core
      # PORTAL-001 / F-03: the portal is a deployable artifact now, so it is
      # built here too. A Dockerfile nobody builds is a Dockerfile that stops
      # working.
      - name: Build portal image
        run: docker build -t lacteva/admin-portal:${{ github.sha }} apps/admin-portal
      # Same reasoning for the marketing site. It is NOT in images.yml yet:
      # the OIDC role there reaches exactly two ECR repositories, so
      # publishing needs a lacteva/marketing-site repository plus a role
      # policy change first — an infra decision, recorded in the app README.
      - name: Build marketing-site image
        run: docker build -t lacteva/marketing-site:${{ github.sha }} apps/marketing-site
      # TODO(M3): push to ECR + deploy (AWS infra lands in infra/ per roadmap).
