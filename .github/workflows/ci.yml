name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docs:
    name: Documentation standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate documentation
        run: python3 tools/validate/validate_docs.py
      - name: Check XREF freshness
        run: python3 tools/xref/generate_xref.py --check

  platform-core:
    name: platform-core (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/platform-core
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: services/platform-core/pyproject.toml
      - name: Install dependencies
        run: uv sync
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Tests
        run: uv run pytest

  platform-core-image:
    name: platform-core (docker build)
    runs-on: ubuntu-latest
    needs: platform-core
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t lacteva/platform-core:${{ github.sha }} services/platform-core
      # TODO(M3): push to ECR + deploy (AWS infra lands in infra/ per roadmap).
