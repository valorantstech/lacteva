# Build the deployable images somewhere other than the machine that serves them.
#
# DEMO-009 built both images ON the production host and hit `spawn ENOMEM`: the
# host runs `vm.overcommit_memory=2`, so forking a Next.js build worker needs
# commit charge equal to the parent's reservation and is refused while the
# platform is also resident. The disk reached 100% twice from build cache in
# the same week. Both are symptoms of one mistake — a 2 vCPU / 4 GB instance
# was doing a compiler's job and a server's job at the same time.
#
#   git → GitHub Actions → docker build → ECR → the EC2 pulls
#
# The EC2 now only ever pulls. Cost of the change: nothing recurring. The
# runners are GitHub's, the two ECR repositories already existed, ECR→EC2
# transfer inside ap-south-1 is free, and the IAM role and OIDC provider that
# replace long-lived keys are free. See DEMO-010-FINAL.md §"AWS cost impact".
#
# No AWS secret is stored in GitHub. The runner exchanges its OIDC token for a
# session on `lacteva-github-actions-ecr`, whose trust policy admits only this
# repository's branches and tags (never a pull request, which must not be able
# to publish an image) and whose permissions reach only these two repositories.

name: Images

on:
  push:
    branches: [main]
    paths:
      - "services/platform-core/**"
      - "apps/admin-portal/**"
      - "apps/marketing-site/**"
      - ".github/workflows/images.yml"
      # WO-44: the release tree is an image now, so a commit that changes only
      # nginx config or a deploy script has to publish a tag as well. Before
      # this, such a commit produced NOTHING deployable — there was no
      # `main-<sha>` to hand to deploy.sh, which is half of why configuration
      # only ever reached the host by hand.
      - "infra/**"
      - "docker-compose.production.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (default: <branch>-<short sha>)"
        required: false
        type: string

# Deploys are pinned to an immutable tag, so two runs racing to publish the
# same tag would be the one way to make a tag mean two different things.
concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # the OIDC token; this is what replaces stored AWS keys

env:
  AWS_REGION: ap-south-1
  ROLE_ARN: arn:aws:iam::590182060076:role/lacteva-github-actions-ecr
  REGISTRY: 590182060076.dkr.ecr.ap-south-1.amazonaws.com

jobs:
  tag:
    name: Resolve the tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: resolve
        # The same shape the release tags already use (`demo009-dae3b28`), so a
        # tag in ECR can always be traced back to one commit.
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            tag="${{ inputs.tag }}"
          else
            # Bash substitution, not `tr`: `tr -c` also replaces the trailing
            # newline, so `main` became `main-` and the first tag published
            # was `main--b07d12b`. Harmless, and wrong every time.
            branch="${GITHUB_REF_NAME//[^a-zA-Z0-9._-]/-}"
            tag="${branch}-$(git rev-parse --short HEAD)"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "publishing as ${tag}" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: ${{ matrix.name }}
    needs: tag
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # one image failing should not hide the other's result
      matrix:
        include:
          - name: platform-core
            context: services/platform-core
            dockerfile: services/platform-core/Dockerfile
            repository: lacteva/platform-core
            tag_prefix: ""
            build-args: ""
          # WO-44. The release tree — compose file, nginx config, deploy and
          # backup scripts — published as an artifact addressed by the same
          # tag as the code, so `deploy.sh <tag>` can materialise a release
          # from the registry instead of from the host's own disk.
          #
          # It goes into the EXISTING platform-core repository under a
          # `release-` prefix rather than a third ECR repository, because the
          # OIDC role's policy reaches exactly these two repositories: a new
          # one would need an IAM change made outside this repo, which is a
          # worse trade than a tag prefix for an artifact that is versioned in
          # lockstep with the code anyway.
          - name: release
            context: .
            dockerfile: infra/deploy/Dockerfile.release
            repository: lacteva/platform-core
            tag_prefix: "release-"
            build-args: ""
          # WO-63 / MARKETING-001. The public website, published into the
          # admin-portal repository under a `marketing-` prefix for the same
          # reason the release tree uses `release-` in platform-core: the CI
          # role can push to exactly two repositories, and a third would need
          # an IAM change made outside this repo.
          - name: marketing-site
            context: apps/marketing-site
            dockerfile: apps/marketing-site/Dockerfile
            repository: lacteva/admin-portal
            tag_prefix: "marketing-"
            # WO-65: the portal's address is INLINED at build time by
            # `next build`, so it has to be here rather than in compose —
            # a `NEXT_PUBLIC_*` variable added at runtime is read by nothing.
            # Without it the site's own Login button landed on a page saying
            # the platform's address was not configured, and offered a
            # customer who wanted to sign in a trial sign-up instead.
            build-args: |
              NODE_HEAP_MB=4096
              NEXT_PUBLIC_PORTAL_URL=https://app.lacteva.com
          - name: admin-portal
            context: apps/admin-portal
            dockerfile: apps/admin-portal/Dockerfile
            repository: lacteva/admin-portal
            tag_prefix: ""
            # The 768 MB cap exists because the HOST could not fork a bigger
            # worker. A GitHub runner has 16 GB and no strict overcommit, so
            # the build is given room here rather than inheriting a constraint
            # from a machine it no longer runs on.
            build-args: |
              NODE_HEAP_MB=4096
    steps:
      - uses: actions/checkout@v4

      # Kept because it names the identity this job presents, which is the
      # thing that goes wrong. `sub` and `aud` are not secrets — they are the
      # repository, the ref and a fixed audience.
      #
      # It was NOT what solved the first failure, and that is worth recording:
      # job logs need admin rights on the repository, so a step that prints
      # the answer into a log is useless to anyone who cannot read the log.
      # **CloudTrail answered it.** A refused `AssumeRoleWithWebIdentity` is
      # logged with the offered subject in `userIdentity.principalId`:
      #
      #   aws cloudtrail lookup-events \
      #     --lookup-attributes AttributeKey=EventName,AttributeValue=AssumeRoleWithWebIdentity
      #
      # which showed the org has GitHub's immutable identifiers turned on, so
      # the subject carries numeric owner and repository IDs:
      #
      #   repo:valorantstech@164855793/lacteva@1319582534:ref:refs/heads/main
      #
      # not the documented `repo:owner/name:ref:...`. The trust policy matches
      # that form exactly rather than being loosened to `repo:owner/name:*` —
      # the IDs are the STRONGER identifier, because a repository deleted and
      # recreated under the same name gets a new one and cannot inherit this
      # role's access.
      - name: What this runner will present to AWS
        run: |
          curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" \
            > /tmp/oidc.json
          python3 .github/workflows/show-oidc-claims.py /tmp/oidc.json

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::590182060076:role/lacteva-github-actions-ecr
          aws-region: ap-south-1
          audience: sts.amazonaws.com
          role-session-name: images-${{ github.run_id }}

      - id: login
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ matrix.repository }}:${{ matrix.tag_prefix }}${{ needs.tag.outputs.tag }}
          build-args: ${{ matrix.build-args }}
          provenance: false # ECR shows an untagged attestation manifest otherwise
          # Layer cache lives with GitHub, not on the host, and is capped by
          # GitHub rather than by our disk.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: Record what was published
        run: |
          {
            echo "### ${{ matrix.repository }}"
            echo '```'
            echo "${{ env.REGISTRY }}/${{ matrix.repository }}:${{ matrix.tag_prefix }}${{ needs.tag.outputs.tag }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deployable:
    name: All four images published
    needs: [tag, build]
    runs-on: ubuntu-latest
    steps:
      # A deploy needs ALL FOUR at the same tag — the API, the portal, the
      # marketing site (WO-63), and since WO-44 the release tree that carries
      # the configuration they run beside. Saying so in one place stops
      # someone deploying a tag where only some of them exist.
      - run: |
          {
            echo "## Deployable"
            echo "On the host:"
            echo '```'
            echo "sudo /opt/lacteva/current/infra/deploy/deploy.sh ${{ needs.tag.outputs.tag }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
